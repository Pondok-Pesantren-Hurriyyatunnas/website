# Konfigurasi dashboard admin (Sveltia CMS)
# Dokumentasi: https://github.com/sveltia/sveltia-cms

backend:
  name: github
  repo: Pondok-Pesantren-Hurriyyatunnas/webiste
  branch: main
  # Isi setelah memasang Sveltia CMS Authenticator di Cloudflare Workers (lihat README):
  # base_url: https://sveltia-cms-auth.NAMA-AKUN.workers.dev

site_url: https://ponpes-hurriyyatunnas.pages.dev
display_url: https://ponpes-hurriyyatunnas.pages.dev
logo_url: /favicon.svg

# Semua gambar yang diupload lewat dashboard disimpan di sini
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: news
    label: Berita
    label_singular: Berita
    folder: src/content/news
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} ({{date}})"
    fields:
      - { name: title, label: Judul, widget: string }
      - name: date
        label: Tanggal
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
      - name: category
        label: Kategori
        widget: select
        options: [Kegiatan, Pengumuman, Prestasi, Kajian, Artikel]
        default: Kegiatan
      - { name: thumbnail, label: Gambar Utama, widget: image, required: false }
      - name: excerpt
        label: Ringkasan
        widget: text
        required: false
        hint: Satu-dua kalimat yang tampil di daftar berita.
      - name: draft
        label: Simpan sebagai draft (belum tampil di website)
        widget: boolean
        default: false
      - { name: body, label: Isi Berita, widget: markdown }

  - name: gallery
    label: Galeri
    label_singular: Foto
    folder: src/content/gallery
    create: true
    extension: json
    format: json
    identifier_field: title
    slug: "{{year}}{{month}}{{day}}-{{slug}}"
    summary: "{{title}}"
    fields:
      - { name: title, label: Judul Foto, widget: string }
      - { name: image, label: Foto, widget: image }
      - name: date
        label: Tanggal
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        default: "{{now}}"
      - { name: caption, label: Keterangan, widget: string, required: false }

  - name: settings
    label: Pengaturan
    files:
      - name: admissions
        label: Info PSB (Pendaftaran Santri Baru)
        file: src/data/admissions.json
        format: json
        fields:
          - { name: academicYear, label: Tahun Ajaran, widget: string }
          - { name: isOpen, label: Pendaftaran dibuka?, widget: boolean }
          - name: registrationUrl
            label: Link Formulir Pendaftaran (Google Form)
            widget: string
          - name: schedule
            label: Jadwal
            widget: list
            fields:
              - { name: activity, label: Kegiatan, widget: string }
              - { name: time, label: Waktu, widget: string }
          - name: requirements
            label: Persyaratan
            widget: list
            field: { name: item, label: Syarat, widget: string }
          - name: fees
            label: Rincian Biaya
            widget: list
            fields:
              - { name: item, label: Item, widget: string }
              - { name: amount, label: Nominal, widget: string }

      - name: site
        label: Info Pondok & Kontak
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Nama Pondok, widget: string }
          - { name: shortName, label: Nama Singkat, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: description, label: Deskripsi Singkat, widget: text }
          - { name: foundedYear, label: Tahun Berdiri, widget: string }
          - { name: address, label: Alamat, widget: text }
          - { name: phone, label: Telepon, widget: string }
          - name: whatsapp
            label: Nomor WhatsApp
            widget: string
            hint: Format internasional tanpa + dan spasi, contoh 6281234567890
          - { name: email, label: Email, widget: string }
          - { name: instagram, label: Link Instagram, widget: string, required: false }
          - { name: facebook, label: Link Facebook, widget: string, required: false }
          - { name: youtube, label: Link YouTube, widget: string, required: false }
          - name: mapsQuery
            label: Kata kunci lokasi Google Maps
            widget: string
            hint: Nama tempat seperti yang muncul di Google Maps
